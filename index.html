<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ТС ПИОТ · СП</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<svg class="wave-bg" viewBox="0 0 1600 1100" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="silver" x1="0" x2="1" y2="1"><stop stop-color="#f5f8fd"/><stop offset=".45" stop-color="#dbe4f0"/><stop offset=".6" stop-color="#f8faff"/><stop offset="1" stop-color="#d6e2ee"/></linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".06"/><stop offset=".5" stop-color="#fff" stop-opacity=".82"/><stop offset="1" stop-color="#aab9cc" stop-opacity=".1"/></linearGradient>
    <filter id="bgblur"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <rect width="1600" height="1100" fill="url(#silver)"/>
  <path d="M-200 600Q300 900 750 520T1800 250V400Q1200 340 750 650T-200 750Z" fill="url(#ribbon)"/>
  <path d="M-200 615Q300 910 750 535T1800 265" fill="none" stroke="#fff" stroke-width="3.5" opacity=".9"/>
  <path d="M-100 50Q450-160 760 130T1700 30V170Q1100 430 760 230T-100 190Z" fill="url(#ribbon)"/>
  <path d="M-150 1050Q300 650 800 920T1750 710" fill="none" stroke="#fff" stroke-width="80" opacity=".6" filter="url(#bgblur)"/>
</svg>
<div class="blobs" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="shell">
  <header class="brandbar">
    <div class="brand"><span class="brand-bars" aria-hidden="true"><i></i><i></i><i></i></span>ТС ПИОТ АНАЛИТИКА</div>
    <div class="top-meta">
      <span id="modeBadge" class="pill">Google Sheets</span>
      <span id="topSave" class="pill ok">Загрузка</span>
    </div>
  </header>
  <div class="workspace">
    <aside class="sidebar">
      <nav id="navigation" aria-label="Основная навигация"></nav>
      <div class="sidebar-foot">
        <div class="wordmark">СП</div>
        <img class="_logo_1k160_78" alt="LIFE&nbsp;PAY" src="/assets/lifepay-logo-BlyhidjW.svg" onerror="this.onerror=null;this.src='https://life-pay.ru/assets/lifepay-logo-BlyhidjW.svg'">
        <small>АНАЛИТИКА СП · v4.7</small>
      </div>
    </aside>
    <main class="main">
      <div class="pagebar">
        <h1 id="title">Главная</h1>
        <div class="controls">
          <div class="month-wrap">
            <button class="icon-btn" id="prevMonth" aria-label="Предыдущий месяц">‹</button>
            <select id="month" aria-label="Месяц"></select>
            <button class="icon-btn" id="nextMonth" aria-label="Следующий месяц">›</button>
          </div>
          <button class="icon-btn" id="reload" title="Обновить" aria-label="Обновить данные">↻</button>
          <button class="icon-btn" id="fullscreen" title="Полный экран" aria-label="Полный экран">⛶</button>
        </div>
      </div>
      <div id="page" aria-busy="true">
        <div class="loading"><div class="spinner"></div><div>Загружаю данные из таблицы…</div></div>
      </div>
      <footer class="footer">
        <span id="sourceInfo">Заявка · Отсутствует задача ЕСП · Суммы</span>
        <span class="footer-brand">
          <img class="_logo_1k160_78" alt="LIFE&nbsp;PAY" src="/assets/lifepay-logo-BlyhidjW.svg" onerror="this.onerror=null;this.src='https://life-pay.ru/assets/lifepay-logo-BlyhidjW.svg'">
        </span>
        <span id="updated"></span>
      </footer>
    </main>
  </div>
</div>
<div id="chartTip" class="chart-tip" aria-hidden="true"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<dialog id="conflict">
  <h2>Данные изменены в другом окне</h2>
  <p>Ваш ввод остался на экране. Скопируйте его перед обновлением.</p>
  <div id="conflictDraft"></div>
  <div class="actions">
    <button class="btn" data-close-dialog>Вернуться к вводу</button>
    <button class="btn primary" id="resolveConflict">Обновить данные</button>
  </div>
</dialog>

<script defer src="./piot.js"></script>
<script defer src="./demo.js"></script>
<script defer src="./app.js"></script>
</body>
</html>
