<script>
/* =====================================================
   PIOT ACCESS — пароль, ограничение попыток, автоблокировка
   Важно: это локальная блокировка интерфейса. Для защиты API
   необходима серверная авторизация в Google Apps Script.
   ===================================================== */
(function(){
  'use strict';
  const SESSION_KEY = 'piot_pin_ok';
  const PASSWORD_KEY = 'piot_access_password_v2';
  const LOG_KEY = 'piot_access_log_v1';
  const FAIL_KEY = 'piot_access_failures_v1';
  const IDLE_MS = 15 * 60 * 1000;
  const ITERATIONS = 210000;
  const DEFAULT_SALT = '8f6a2d91c4b7e305a19f6c2e7d4b8301';
  const DEFAULT_HASH = '38c3451d59dfae7179b98ae052fd631c0715157a98cd143861575587e03b3b41';
  const pinScreen = document.getElementById('pinScreen');
  const app = document.getElementById('app');
  const form = document.getElementById('authForm');
  const input = document.getElementById('accessPassword');
  const submit = document.getElementById('authSubmit');
  const errorMsg = document.getElementById('pinError');
  const reveal = document.getElementById('toggleAccessPassword');
  let idleTimer = null;
  let started = false;

  function hexBytes(hex){
    const out = new Uint8Array(hex.length / 2);
    for(let i=0;i<out.length;i++) out[i] = parseInt(hex.slice(i*2,i*2+2),16);
    return out;
  }
  function toHex(bytes){ return Array.from(new Uint8Array(bytes)).map(v=>v.toString(16).padStart(2,'0')).join(''); }
  function readPassword(){
    try{
      const raw = localStorage.getItem(PASSWORD_KEY);
      if(raw){ const value = JSON.parse(raw); if(value && value.salt && value.hash) return value; }
    }catch(e){}
    return {salt:DEFAULT_SALT,hash:DEFAULT_HASH,iterations:ITERATIONS,defaultPassword:true};
  }
  async function digestPassword(password,salt,iterations){
    if(!window.crypto || !crypto.subtle) throw Error('Безопасная проверка пароля недоступна в этом браузере. Откройте сайт по HTTPS.');
    const material = await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);
    const bits = await crypto.subtle.deriveBits({name:'PBKDF2',salt:hexBytes(salt),iterations:iterations||ITERATIONS,hash:'SHA-256'},material,256);
    return toHex(bits);
  }
  async function verifyPassword(password){
    const cfg = readPassword();
    const candidate = await digestPassword(password,cfg.salt,cfg.iterations||ITERATIONS);
    if(candidate.length !== cfg.hash.length) return false;
    let diff = 0;
    for(let i=0;i<candidate.length;i++) diff |= candidate.charCodeAt(i) ^ cfg.hash.charCodeAt(i);
    return diff === 0;
  }
  function readFailures(){
    try{ return JSON.parse(localStorage.getItem(FAIL_KEY)||'{"count":0,"until":0}'); }
    catch(e){ return {count:0,until:0}; }
  }
  function writeFailures(value){ try{ localStorage.setItem(FAIL_KEY,JSON.stringify(value)); }catch(e){} }
  function readLog(){
    try{ const value=JSON.parse(localStorage.getItem(LOG_KEY)||'[]'); return Array.isArray(value)?value:[]; }
    catch(e){ return []; }
  }
  function deviceLabel(){
    const ua=navigator.userAgent||'';
    if(/Android/i.test(ua)) return 'Android · браузер';
    if(/iPhone|iPad|iPod/i.test(ua)) return 'iPhone/iPad · браузер';
    if(/Windows/i.test(ua)) return 'Windows · браузер';
    if(/Macintosh|Mac OS/i.test(ua)) return 'macOS · браузер';
    if(/Linux/i.test(ua)) return 'Linux · браузер';
    return 'Неизвестное устройство';
  }
  function recordLogin(){
    const log=readLog();
    log.unshift({at:new Date().toISOString(),event:'Успешный вход',device:deviceLabel()});
    try{ localStorage.setItem(LOG_KEY,JSON.stringify(log.slice(0,50))); }catch(e){}
  }
  function showError(message){
    errorMsg.textContent=message;
    errorMsg.classList.add('show');
    input.classList.add('auth-invalid');
    setTimeout(()=>input.classList.remove('auth-invalid'),420);
  }
  function clearError(){ errorMsg.textContent=''; errorMsg.classList.remove('show'); input.classList.remove('auth-invalid'); }
  function resetIdleTimer(){
    clearTimeout(idleTimer);
    if(sessionStorage.getItem(SESSION_KEY)==='1') idleTimer=setTimeout(lock,IDLE_MS);
  }
  function startApp(){
    pinScreen.style.display='none';
    app.style.display='block';
    resetIdleTimer();
    if(!started && typeof window.PIOT_START==='function'){
      started=true;
      app.dataset.piotStarted='1';
      window.PIOT_START();
    }
  }
  function lock(){
    clearTimeout(idleTimer);
    sessionStorage.removeItem(SESSION_KEY);
    app.style.display='none';
    pinScreen.style.display='flex';
    pinScreen.style.opacity='1';
    input.value='';
    clearError();
    setTimeout(()=>input.focus(),80);
  }
  async function saveNewPassword(currentPassword,newPassword){
    if(!await verifyPassword(currentPassword)) throw Error('Текущий пароль указан неверно.');
    if(String(newPassword||'').length<10) throw Error('Новый пароль должен содержать не менее 10 символов.');
    if(newPassword===currentPassword) throw Error('Новый пароль должен отличаться от текущего.');
    const salt=new Uint8Array(16); crypto.getRandomValues(salt);
    const saltHex=toHex(salt);
    const hash=await digestPassword(newPassword,saltHex,ITERATIONS);
    localStorage.setItem(PASSWORD_KEY,JSON.stringify({salt:saltHex,hash:hash,iterations:ITERATIONS,changedAt:new Date().toISOString()}));
    return true;
  }
  window.PIOT_SECURITY={
    startApp:startApp,
    lock:lock,
    changePassword:saveNewPassword,
    getLog:readLog,
    clearLog:function(){try{localStorage.removeItem(LOG_KEY);}catch(e){}},
    getInfo:function(){return {idleMinutes:15,defaultPassword:!!readPassword().defaultPassword,logCount:readLog().length};}
  };

  if(reveal){
    reveal.addEventListener('click',()=>{
      const show=input.type==='password';
      input.type=show?'text':'password';
      reveal.textContent=show?'Скрыть':'Показать';
      reveal.setAttribute('aria-label',show?'Скрыть пароль':'Показать пароль');
      input.focus();
    });
  }
  if(form){
    form.addEventListener('submit',async e=>{
      e.preventDefault(); clearError();
      const failures=readFailures();
      if(failures.until>Date.now()){
        const seconds=Math.ceil((failures.until-Date.now())/1000);
        showError('Слишком много попыток. Повторите через '+seconds+' сек.'); return;
      }
      const password=input.value;
      if(!password){showError('Введите пароль для входа.');return;}
      submit.disabled=true;
      submit.querySelector('span').textContent='Проверяем…';
      try{
        if(await verifyPassword(password)){
          writeFailures({count:0,until:0});
          sessionStorage.setItem(SESSION_KEY,'1');
          recordLogin();
          clearError();
          startApp();
        }else{
          const count=(Number(failures.count)||0)+1;
          const blocked=count>=5;
          writeFailures({count:blocked?0:count,until:blocked?Date.now()+60000:0});
          showError(blocked?'5 неверных попыток. Вход заблокирован на 60 секунд.':'Неверный пароль. Проверьте ввод и попробуйте ещё раз.');
          input.value=''; input.focus();
        }
      }catch(err){showError(err.message||'Не удалось проверить пароль.');}
      finally{submit.disabled=false;submit.querySelector('span').textContent='Войти в аналитику';}
    });
  }
  ['pointerdown','keydown','touchstart','scroll'].forEach(name=>document.addEventListener(name,resetIdleTimer,{passive:true}));
  if(sessionStorage.getItem(SESSION_KEY)==='1'){
    pinScreen.style.display='none'; app.style.display='block';
    resetIdleTimer();
  }else{
    app.style.display='none'; pinScreen.style.display='flex';
  }
})();
</script>

<script>
/* =====================================================
   ЯДРО PIOT — бизнес-логика
   ===================================================== */
var Piot=(function(){'use strict';
var FIELDS=['plan','done','closed','sp','esp'];
var BANKS=[
  {id:'vtb',  name:'ВТБ',       color:'#2788ef',keys:['втб','vtb','бм-банк']},
  {id:'alfa', name:'Альфа-Банк',color:'#ef384b',keys:['альфа','альфа-банк','alfa','alpha']},
  {id:'tochka',name:'Точка',    color:'#8739ed',keys:['точка','tochka']},
  {id:'psb',  name:'ПСБ',       color:'#ff850e',keys:['псб','psb','промсвязьбанк','промсвязь банк']}
];
function norm(v){return String(v==null?'':v).trim().toLowerCase().replace(/ё/g,'е').replace(/\s+/g,' ');}
function contains(s,keys){s=norm(s);return keys.some(function(k){return k&&s.indexOf(norm(k))!==-1;});}
function token(s,k){
  s=norm(s);k=norm(k);var pos=s.indexOf(k);
  while(pos>=0){
    if(!/[a-zа-я0-9]/i.test(s.charAt(pos-1))&&!/[a-zа-я0-9]/i.test(s.charAt(pos+k.length)))return true;
    pos=s.indexOf(k,pos+1);
  }
  return false;
}
function validMonth(v){return /^\d{4}-(0[1-9]|1[0-2])$/.test(String(v));}
function parseDate(v){
  if(v==null||v==='')return '';
  var a=String(v).trim().match(/^(\d{4})-(\d{2})-(\d{2})/),y,m,d;
  if(a){y=+a[1];m=+a[2];d=+a[3];}
  else{
    a=String(v).trim().match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{4}|\d{2})$/);
    if(!a)return '';
    d=+a[1];m=+a[2];y=+a[3];if(y<100)y+=2000;
  }
  if(y<1900||y>2199)return '';
  var dt=new Date(Date.UTC(y,m-1,d));
  return dt.getUTCFullYear()===y&&dt.getUTCMonth()===m-1&&dt.getUTCDate()===d

  return dates[dates.length-1] || (month?month+'-01':new Date().toISOString().slice(0,10));
}
// Cache the same calendar boundaries for every record in one view.
// The key includes the loaded dataset so reloads cannot reuse stale dates.
let periodWindowMemoKey='', periodWindowMemoData=null, periodWindowMemo=null;
function periodWindow(){
  const key=s.periodMode+'|'+s.month+'|'+s.periodDate;
  if(periodWindowMemo!==null&&periodWindowMemoKey===key&&periodWindowMemoData===s.data)
    return periodWindowMemo;
  let windowRange;
  if(s.periodMode==='month'){
    windowRange={mode:'month',start:s.month?s.month+'-01':'',end:s.month?shiftDay(s.month+'-01',32).slice(0,7)+'-01':''};
  }else{
    const selected=isoDay(s.periodDate)||defaultPeriodDay(s.month);
    const start=s.periodMode==='week'?weekMonday(selected):selected;
    windowRange={mode:s.periodMode,start,end:shiftDay(start,s.periodMode==='week'?7:1)};
  }
  periodWindowMemoKey=key;periodWindowMemoData=s.data;periodWindowMemo=windowRange;
  return windowRange;
}
function inPeriod(value){
  const w=periodWindow(),d=isoDay(value);
  if(w.mode==='month')return !s.month || !!d&&d.slice(0,7)===s.month;
  return !!d && d>=w.start&&d<w.end;
}
function periodName(){
  const w=periodWindow();
  if(w.mode==='month')return s.month?monthLabel(s.month):'За всё время';
  const fmt=d=>new Date(d+'T12:00:00Z').toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'});
  return w.mode==='day'?fmt(w.start):fmt(w.start)+' — '+fmt(shiftDay(w.end,-1));
}
function periodText(){return s.periodMode==='week'?'неделю':s.periodMode==='day'?'день':'месяц';}
function eventRows(){return Piot.filter(s.data.records, s.filter, cfg());}
function rows(){return eventRows().filter(r=>inPeriod(r.date));}
function periodSummary(records){
  if(s.periodMode==='month')return Piot.eventSummary(records,cfg(),s.month);
  const arrivals=records.filter(r=>inPeriod(r.date));
  const events=records.filter(r=>r.source!=='noesp'&&inPeriod(r.dateStatus));
  const out=Piot.summary(arrivals,cfg());
  out.done=events.filter(r=>Piot.isDone(r,cfg())).length;
  out.closed=events.filter(r=>Piot.isClosed(r,cfg())).length;
  out.open=arrivals.filter(r=>Piot.hasApplication(r)&&!Piot.isDone(r,cfg())).length;
  return out;
}
function periodActivity(records,gran){
  if(s.periodMode==='month')return Piot.activityPeriods(records,gran,cfg(),s.month);
  const out=new Map();
  function count(date,key){
    if(!inPeriod(date))return;
    const k=Piot.periodKey(date,gran);
    if(!out.has(k))out.set(k,{key:k,total:0,done:0,closed:0});
    out.get(k)[key]++;
  }
  records.filter(r=>r.source!=='noesp').forEach(r=>{
    if(Piot.hasApplication(r))count(r.date,'total');
    if(Piot.isDone(r,cfg()))count(r.dateStatus,'done');
    if(Piot.isClosed(r,cfg()))count(r.dateStatus,'closed');
  });
  return [...out.values()].sort((a,b)=>a.key.localeCompare(b.key));
}
function scopedIncome(){
  if(s.periodMode==='month')return Piot.income(eventRows(),detailed()?{}:s.data.ledger,s.month,cfg());
  // Ручной доход ЕСП относится только к месяцу: не приписываем его дню/неделе.
  return Piot.income(rows(),{},'',cfg());
}

function toast(text, error){
  const el = document.createElement('div');
  el.className = 'toast' + (error?' err':'');
  el.textContent = text;
  $('#toasts').append(el);
  setTimeout(()=>{ el.style.opacity=0; setTimeout(()=>el.remove(),300); }, 5600);
}

const cVal = (n,money) => {
  const valid = n!=null && n!=='' && Number.isFinite(Number(n));
  return `<span${valid?` data-count="${Number(n)}"`:``}${money?' data-money="1"':''}>${money?rub(n):number(n)}</span>`;
};

function playCounters(){
  if(!fxOn()) return;
  $$('[data-count]').forEach(el => {
    const target = Number(el.dataset.count);
    if(!isFinite(target)) return;
    const money = el.dataset.money==='1', t0=performance.now(), dur=820;
    function step(t){
      const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3), v=target*e;
      el.textContent = money ? rub(Math.round(v)) : number(Math.round(v));
      if(k<1) requestAnimationFrame(step);
      else el.textContent = money ? rub(target) : number(target);
    }
    requestAnimationFrame(step);
  });
}

function options(){
  // Keep the native month picker compact and predictable across Windows/Chrome,
  // Android and Safari. Native optgroup headers were rendered as blank rows
  // in some browsers, so the year remains in each visible month label instead.
  const months = [...new Set((Array.isArray(s.data.months)?s.data.months:[]).filter(Piot.validMonth))];
  if(s.month&&!months.includes(s.month))months.push(s.month);
  months.sort();
  $('#month').innerHTML = '<option value="">За всё время</option>' +
    months.map(m => `<option value="${m}"${m===s.month?' selected':''}>${monthLabel(m)}</option>`).join('');
  $('#month').value = s.month;
}

function saveStatus(state){
  const pending = Object.keys(s.draft).length > 0 || s.configDirty;
  const text = state || (s.saveError?'Не сохранено':s.saving?'Сохраняю...':pending?'Есть изменения':'Сохранено');
  $('#topSave').textContent = text;
  $('#topSave').className = 'pill ' + (s.saveError?'err':pending||s.saving?'warn':'ok');
  $$('[data-save-status]').forEach(el => {
    el.textContent = s.saveError||text;
    el.className = 'save-status ' + (s.saveError?'error':pending||s.saving?'waiting':'');
  });
}

function edit(field, value){
  try{
    if(!s.month) throw Error('Выберите конкретный месяц');
    const val = value.trim()===''?null:Number(value);
    Piot.validatePatch({[field]:val});
    delete s.invalid[field]; s.draft[field]=val; s.saveError='';
    clearTimeout(s.timer);
    s.timer = setTimeout(()=>flush().catch(()=>{}), 950);
    saveStatus();
  }catch(e){ s.invalid[field]=true; s.saveError=e.message; clearTimeout(s.timer); saveStatus(); }
}

async function flush(){
  clearTimeout(s.timer);
  if(Object.keys(s.invalid).length) throw Error('Исправьте некорректный ввод');
  if(s.saving) await s.saving;
  if(!Object.keys(s.draft).length) return;
  const month=s.month, patch=Object.assign({},s.draft), revision=manual().revision;
  s.saving = rpc('apiSaveMonth',{month,patch,revision}).then(result=>{
    s.data.ledger[month] = result.value;
    Object.keys(patch).forEach(k=>{ if(s.draft[k]===patch[k]) delete s.draft[k]; });
    s.saveError = '';
  }).catch(e=>{
    s.saveError = e.message;
    if(String(e.message).includes('CONFLICT')){
      $('#conflictDraft').textContent = Object.keys(s.draft).map(k=>k+': '+s.draft[k]).join(' · ');
      if(!$('#conflict').open) $('#conflict').showModal();
    }
    toast(e.message, true); throw e;
  }).finally(()=>{ s.saving=null; saveStatus(); });
  saveStatus(); await s.saving;
  if(Object.keys(s.draft).length) return flush();
  if(!document.activeElement.matches('[data-field]')) render({fx:false});
}

function numericInput(field, label){
  const value = Object.prototype.hasOwnProperty.call(s.draft,field) ? s.draft[field] : manual()[field];
  const disabled = !s.month, auto = (manual().auto||{})[field];
  return `<input type="number" min="0" max="9999999999" step="${['sp','esp'].includes(field)?'.01':'1'}"
    data-field="${field}" aria-label="${h(label)}" value="${value==null?'':value}"
    placeholder="${auto!=null?'Авто: '+auto:'Введите значение'}"
    ${disabled?'disabled':''} ${s.invalid[field]?'aria-invalid="true"':''}>`;
}

/* ---- графики ---- */
function chart(labels, series, opts){
  opts = opts||{};
  series = (series||[]).filter(Boolean);
  if(!labels.length||!series.length) return empty('Нет данных для графика.');
  const uid = 'c'+(++chartId);
  const W=1000,H=320,L=72,R=opts.dual?72:28,T=26,B=52;
  const plotW=W-L-R, plotH=H-T-B, baseY=T+plotH, n=labels.length;
  const max={left:0,right:0};
  series.forEach(d=>{ const ax=d.axis||'left'; (d.values||[]).forEach(v=>{ const x=Number(v)||0; if(x>max[ax])max[ax]=x; }); });
  function niceMax(v,money){
    if(!v) return money?1000:10;
    const raw=v/4, power=Math.pow(10,Math.floor(Math.log10(raw)));
    const k=raw/power, step=(k<=1?1:k<=2?2:k<=2.5?2.5:k<=5?5:10)*power;
    return Math.max(step, Math.ceil(v*1.14/step)*step);
  }
  max.left  = niceMax(max.left,  !!opts.money);
  max.right = niceMax(max.right, false);
  const allBars = series.every(d=>d.type==='bar');
  const band = plotW/Math.max(1,n);
  const xLine= i=>n<2?L+plotW/2:L+(i/(n-1))*plotW;
  const xBand= i=>L+(i+.5)*band;
  const xOf  = i=>allBars?xBand(i):xLine(i);
  const yOf  = (v,ax)=>baseY-Math.max(0,Number(v)||0)/(max[ax||'left']||1)*plotH;
  const fmt  = (v,money)=>money?(v>=1e6?(v/1e6).toFixed(1)+' млн':v>=1e3?Math.round(v/1e3)+' тыс':Math.round(v)+''):Math.round(v).toLocaleString('ru-RU');
  function smooth(pts){
    if(!pts.length) return '';
    if(pts.length<2) return `M${pts[0][0]},${pts[0][1]}`;
    let d=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
    for(let i=1;i<pts.length;i++){
      const a=pts[i-1],b=pts[i],dx=(b[0]-a[0])*.42;
      d+=`C${(a[0]+dx).toFixed(1)},${a[1].toFixed(1)} ${(b[0]-dx).toFixed(1)},${b[1].toFixed(1)} ${b[0].toFixed(1)},${b[1].toFixed(1)}`;
    }
    return d;
  }
  let svg = `<svg class="chart-svg" id="${uid}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${h(opts.title||'График')}">
    <title>${h(opts.title||'График')}</title><defs>`;
  series.forEach((d,i)=>{
    svg += `<linearGradient id="${uid}-g${i}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${d.color}" stop-opacity="${d.type==='bar'?'.9':'.3'}"/>
      <stop offset="1" stop-color="${d.color}" stop-opacity="${d.type==='bar'?'.4':'.01'}"/></linearGradient>`;
  });
  svg += `</defs>`;
  for(let i=0;i<=4;i++){
    const yy=(T+plotH*i/4).toFixed(1);
    svg += `<line class="gridline" x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}"/>
      <text class="axis-label" x="${L-10}" y="${+yy+4}" text-anchor="end">${fmt(max.left*(1-i/4),!!opts.money)}</text>`;
    if(opts.dual) svg += `<text class="axis-label" x="${W-R+10}" y="${+yy+4}" text-anchor="start">${fmt(max.right*(1-i/4),false)}</text>`;
  }
  svg += `<line class="axis-base" x1="${L}" y1="${baseY}" x2="${W-R}" y2="${baseY}"/>`;
  svg += `<line class="crosshair" id="${uid}-cross" x1="0" y1="${T-6}" x2="0" y2="${baseY}"/>`;
  const barCount = series.filter(d=>d.type==='bar').length;
  let barIdx = 0;
  series.forEach((d,di)=>{
    const ax = d.axis||'left';
    svg += `<g data-s="${di}">`;
    if(d.type==='bar'){
      const groupW=Math.min(52,band*.72);
      const barW=Math.max(3,groupW/Math.max(1,barCount)*.86);
      const off=(barIdx-(barCount-1)/2)*(barW+2);
      (d.values||[]).forEach((v,i)=>{
        let x=xOf(i)+off-barW/2;
        x=Math.max(L+1,Math.min(W-R-barW-1,x));
        const y=yOf(v,ax), hh=Math.max(0,baseY-y);
        svg += `<rect class="chart-bar" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${hh.toFixed(1)}"
          rx="${Math.min(7,barW/2).toFixed(1)}" fill="url(#${uid}-g${di})" stroke="${d.color}" stroke-opacity=".3"></rect>`;
      });
      barIdx++;
    } else {
      const pts = (d.values||[]).map((v,i)=>[xOf(i),yOf(v,ax)]);
      if(d.area!==false && pts.length>1)
        svg += `<path class="chart-area" d="${smooth(pts)}L${pts[pts.length-1][0].toFixed(1)},${baseY} L${pts[0][0].toFixed(1)},${baseY} Z" fill="url(#${uid}-g${di})" stroke="none"/>`;
      if(pts.length>1) svg += `<path class="chart-line reveal" pathLength="1000" d="${smooth(pts)}" stroke="${d.color}" style="color:${d.color}"/>`;
      pts.forEach((p,i)=>{
        svg += `<circle class="chart-point" data-p="${i}" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4.2"
          fill="#fff" stroke="${d.color}" stroke-width="2.6" style="color:${d.color};animation-delay:${Math.min(.5,i*.035)}s"></circle>`;
      });
    }
    svg += `</g>`;
  });
  const stride = Math.max(1,Math.ceil(n/(plotW/88)));
  const xs = [];
  labels.forEach((label,i)=>{
    xs.push(xOf(i));
    if(i%stride===0||i===n-1){
      const t=String(label);
      svg += `<text class="x-label" x="${xOf(i).toFixed(1)}" y="${H-16}" text-anchor="middle">${h(t.length>16?t.slice(0,14)+'...':t)}</text>`;
    }
    const hw=allBars?band:plotW/Math.max(1,n-1||1);
    let x=xOf(i)-hw/2; x=Math.max(L,Math.min(W-R-1,x));
    svg += `<rect class="hit" data-hit="${uid}" data-i="${i}" x="${x.toFixed(1)}" y="${T-8}" width="${Math.min(hw,W-R-x).toFixed(1)}" height="${(plotH+14).toFixed(1)}"/>`;
  });
  svg += `</svg>`;
  CHARTS[uid] = {labels,xs,series:series.map(d=>({name:d.name,color:d.color,values:d.values||[],money:!!opts.money&&(d.axis||'left')==='left'}))};
  const legend = `<div class="legend">${series.map((d,i)=>
    `<button type="button" data-legend="${uid}" data-s="${i}"><i class="dot" style="--color:${d.color}"></i>${h(d.name)}</button>`).join('')}</div>`;
  const tbl = `<details class="chart-details"><summary>Точные значения</summary>
    <div class="table-wrap"><table><thead><tr><th>Период</th>${series.map(d=>`<th>${h(d.name)}</th>`).join('')}</tr></thead>
    <tbody>${labels.map((l,i)=>`<tr><td>${h(l)}</td>${series.map(d=>`<td class="number">${number(d.values[i])}</td>`).join('')}</tr>`).join('')}</tbody>
    </table></div></details>`;
  return `<div class="chart" data-chart="${uid}"><div class="chart-scroll">${svg}</div>${legend}${tbl}</div>`;
}

function sparkline(values,color){
  const v=values.length?values:[0];
  const W=240,H=44, max=Math.max(1,...v), n=v.length;
  const x=i=>n<2?W/2:i/(n-1)*W;
  const y=k=>H-2-(k/max)*(H-8);
  const pts=v.map((k,i)=>[x(i),y(k)]);
  let d=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for(let i=1;i<pts.length;i++){
    const a=pts[i-1],b=pts[i],dx=(b[0]-a[0])*.42;
    d+=`C${(a[0]+dx).toFixed(1)},${a[1].toFixed(1)} ${(b[0]-dx).toFixed(1)},${b[1].toFixed(1)} ${b[0].toFixed(1)},${b[1].toFixed(1)}`;
  }
  const gid='sp'+(++chartId);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${color}" stop-opacity=".3"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${d}L${W},${H} L0,${H} Z" fill="url(#${gid})"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="3.4" fill="#fff" stroke="${color}" stroke-width="2.4"/>
  </svg>`;
}

function donut(items,title){
  items=items.filter(x=>x.value>0);
  const total=items.reduce((a,x)=>a+x.value,0);
  if(!total) return empty('Положительных значений нет.');
  const circ=2*Math.PI*68; let off=0;
  const arcs=items.map(x=>{
    const len=x.value/total*circ;
    const el=`<circle class="donut-arc" cx="90" cy="90" r="68" fill="none" stroke="${x.color}" stroke-width="26"
      stroke-linecap="butt" data-len="${len.toFixed(2)}" data-rest="${(circ-len).toFixed(2)}"
      stroke-dasharray="${len.toFixed(2)} ${(circ-len).toFixed(2)}"
      stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 90 90)">
      <title>${h(x.name+': '+number(x.value)+' · '+(x.value/total*100).toFixed(1)+'%')}</title></circle>`;
    off+=len; return el;
  }).join('');
  return `<div class="donut-wrap">
    <svg class="donut" viewBox="0 0 180 180" role="img" aria-label="${h(title)}">${arcs}
      <text class="center-count" x="90" y="88" text-anchor="middle">${number(total)}</text>
      <text class="center-label" x="90" y="108" text-anchor="middle">${h(title)}</text></svg>
    <div class="donut-legend">${items.map(x=>`<div><i class="dot" style="--color:${x.color}"></i><span>${h(x.name)}</span><b>${number(x.value)}</b></div>`).join('')}</div>
  </div>`;
}

function heroPlan(source){
  const records=source||eventRows();
  const a=Piot.eventSummary(records,cfg(),s.month);
  const m=manual(), plan=s.month?m.plan:null, done=a.done;
  const hasPlan=plan!=null, p=hasPlan?Math.min(100,pct(done,plan)):0;
  const left=plan!=null?Math.max(0,plan-done):null;
  const ledger=s.data.ledger||{};
  const monthly=Piot.monthly(records,cfg());
  const historyKeys=!s.month?Object.keys(ledger).filter(k=>Piot.validMonth(k)&&ledger[k]&&ledger[k].plan!=null&&Number.isFinite(Number(ledger[k].plan))).sort().reverse():[];
  const historyMarkup=!s.month?`<div class="plan-history-inline">
    <div class="plan-history-inline-head"><strong>История планов</strong><span>${historyKeys.length?number(historyKeys.length)+' мес.':'за всё время'}</span></div>
    ${historyKeys.length?`<div class="plan-history-inline-list">${historyKeys.map(k=>{
      const row=ledger[k]||{}, stats=monthly[k]||{done:0}, completed=stats.done||0;
      const hasTarget=row.plan!=null&&Number.isFinite(Number(row.plan));
      const target=hasTarget?Number(row.plan):null, progress=target>0?Math.min(100,pct(completed,target)):0;
      return `<button type="button" class="plan-history-item" data-select-month="${k}" title="Открыть показатели за ${monthLabel(k)}">
        <span class="plan-history-month">${monthLabel(k)}</span>
        <strong>${hasTarget?number(target)+' <small>задач</small>':'<small>План не задан</small>'}</strong>
        <span class="plan-history-meta">Выполнено ${number(completed)}${hasTarget?' · '+progress+'%':''}</span>
        <i class="plan-history-track"><b style="width:${progress}%"></b></i>
      </button>`;
    }).join('')}</div>`:'<div class="plan-history-empty">За прошлые месяцы пока нет данных.</div>'}
  </div>`:'';
  const c=2*Math.PI*64, off=c*(1-p/100);
  return `<section class="hero">
    <div class="hero-top">
      <div><span class="hero-kicker">ВЫПОЛНЕНИЕ ПЛАНА</span><h2>Выполнение плана</h2></div>
      <button class="text-btn" data-page="plan">Открыть план →</button>
    </div>
    <div class="hero-body">
      <svg class="ring" viewBox="0 0 160 160" role="img" aria-label="${hasPlan?'Выполнение плана '+p+'%':!s.month?'История планов за всё время':'План не задан'}">
        <defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#5ee6b0"/><stop offset="1" stop-color="#009a66"/></linearGradient></defs>
        <circle class="ring-bg" cx="80" cy="80" r="64"/>
        <circle class="ring-fg" cx="80" cy="80" r="64" transform="rotate(-90 80 80)"
          stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" data-ringoff="${off.toFixed(1)}"/>
        <text class="ring-val" x="80" y="84" text-anchor="middle">${hasPlan?p+'%':'—'}</text>
        <text class="ring-cap" x="80" y="102" text-anchor="middle">${hasPlan?'от плана':!s.month?'весь период':'план не задан'}</text>
      </svg>
      <div class="hero-right">
        ${s.month?`<div class="big-progress"><i style="width:${p}%"></i></div>
        <div class="hero-metrics">
          <div class="hero-metric"><span>ВЫПОЛНЕНО</span><b>${cVal(done)}</b></div>
          <div class="hero-metric"><span>ПЛАН</span><b>${plan==null?'—':cVal(plan)}</b></div>
          <div class="hero-metric"><span>ОСТАЛОСЬ</span><b>${left==null?'—':cVal(left)}</b></div>
        </div>
        <p class="hero-note">${hasPlan?'До выполнения плана осталось <b>'+number(left)+'</b> задач. Учёт — по дате статуса.':'Укажите план на выбранный месяц в разделе «Настройки».'}</p>${s.periodMode!=='month'?'<p class="period-month-note">План и его выполнение показаны за месяц. Для заявок и доходов активен фильтр «'+periodName()+'».</p>':''}`:
        `<div class="hero-alltime-summary"><strong>${cVal(done)}</strong><span>выполнено за весь период</span></div>
        <p class="hero-note">Выбран период «За всё время». Выберите месяц в списке, чтобы открыть его план.</p>${historyMarkup}`}
      </div>
    </div>
  </section>`;
}

function heroOpen(source){
  const records=source||eventRows();
  const a=periodSummary(records);
  const act=periodActivity(records,s.periodMode==='month'?(s.month?'day':'month'):'day');
  const series=act.map(x=>Math.max(0,x.total-x.done));
  const share=a.total?Math.round(a.open/a.total*100):0;
  return `<section class="hero blue">
    <div class="hero-top">
      <div><span class="hero-kicker">ТЕКУЩАЯ НАГРУЗКА</span><h2>Открытые заявки</h2></div>
      <button class="text-btn" data-open-table>Все заявки →</button>

        <div class="hero-sub">${share}% от созданных за период · незавершённые</div>
        <div class="hero-metrics">
          <div class="hero-metric"><span>ВСЕГО</span><b>${cVal(a.total)}</b></div>
          <div class="hero-metric"><span>ВЫПОЛНЕНО</span><b>${cVal(a.done)}</b></div>

  </section>`;
}

function taskStatusDashboard(){
  // One shared slice: all figures use the same period and global filters.
  const base=rows().filter(r=>r.source==='main');
  const src=base.filter(r=>String(r.taskStatus||'').trim());
  const total=src.length;
  const applications=base.filter(Piot.hasApplication);
  // The user's payment rule: a positive value in column F (amount) means paid.
  const amountPaid=applications.filter(r=>Number(r.amount)>0);
  const amountUnpaid=applications.filter(r=>!(Number(r.amount)>0));
  const paymentRate=applications.length?Math.round(amountPaid.length/applications.length*100):0;
  const priority=[
    {name:'Клиент сам установил',tone:'',index:'01',label:'РЕЗУЛЬТАТ № 1',caption:'Самостоятельная установка · количество клиентов'},
    {name:'Клиент настроен с нашей помощью',tone:'assist',index:'02',label:'РЕЗУЛЬТАТ № 2',caption:'Установка с помощью нашей команды'},
    {name:'Платные установки Life Pay',tone:'paid-lp',index:'03',label:'ПЛАТНЫЕ УСТАНОВКИ',caption:'Подтверждена оплата LP в статусе передачи задачи',installation:'lp'},
    {name:'Платные установки Авт.Биз',tone:'paid-autobiz',index:'04',label:'ПЛАТНЫЕ УСТАНОВКИ',caption:'Подтверждена оплата СП в статусе передачи задачи',installation:'avtbiz'}
  ];
  const matches=(v,t)=>{ const a=Piot.norm(v),b=Piot.norm(t); return a===b||a.startsWith(b+':')||a.startsWith(b+' '); };
  const countFor=t=>src.filter(r=>matches(r.taskStatus,t)).length;
  const selfRows=src.filter(r=>matches(r.taskStatus,'Клиент сам установил'));
  const selfPaid=selfRows.filter(r=>Number(r.amount)>0).length;
  const selfUnpaid=selfRows.length-selfPaid;
  const share=(k,denom)=>denom?Math.round(k/denom*100):0;
  const featured=priority.map(p=>{
    const isPaid=!!p.installation;
    const k=isPaid?base.filter(r=>Piot.isPaidInstallation(r,p.installation,cfg())).length:countFor(p.name);
    const part=share(k,isPaid?applications.length:total);
    const active=isPaid?s.installation===p.installation&&s.page==='table':s.filter.task===p.name;
    const action=isPaid?`data-paid-installation="${p.installation}"`:`data-task-status="${h(p.name)}"`;
    const selfPayment=p.name==='Клиент сам установил'
      ?`<span class="priority-payment-split"><span>Оплачено <b>${number(selfPaid)}</b></span><span>Не оплачено <b>${number(selfUnpaid)}</b></span></span>`:'';
    return `<button type="button" class="priority-status-card ${p.tone}${active?' active':''}" ${action} aria-pressed="${active}">
      <span class="priority-kicker"><span class="priority-index">${p.index}</span>${p.label}</span>
      <span class="priority-status-title">${h(p.name)}</span>
      <span class="priority-status-caption">${p.caption}</span>
      ${selfPayment}
      <span class="priority-count-row"><strong>${cVal(k)}</strong><span>заявок <b>${part}%</b></span></span>
      <span class="priority-track"><i style="width:${part}%"></i></span>
      <span class="priority-status-foot">Открыть заявки <span aria-hidden="true">→</span></span></button>`;
  }).join('');
  const counts=new Map();
  src.forEach(r=>{ const name=String(r.taskStatus||'').trim()||'Без статуса'; counts.set(name,(counts.get(name)||0)+1); });
  const others=Array.from(counts.entries())
    .filter(([name])=>name==='Без статуса'||!priority.some(p=>!p.installation&&matches(name,p.name)))
    .sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'ru'));
  const otherHtml=others.length
    ?`<div class="priority-other-list">${others.map(([name,k])=>{
        const part=share(k,total), isEmpty=name==='Без статуса', active=!isEmpty&&s.filter.task===name;
        const row=`<span class="priority-other-name">${h(name)}</span>
          <span class="priority-other-value">${number(k)} <small>${part}%</small></span>
          <span class="priority-other-track"><i style="width:${part}%"></i></span>`;
        return isEmpty?`<div class="priority-other-row muted-row">${row}</div>`
          :`<button type="button" class="priority-other-row${active?' active':''}" data-task-status="${h(name)}" aria-pressed="${active}">${row}</button>`;
      }).join('')}</div>`
    :'<p class="note" style="margin:8px 0">Других статусов пока нет.</p>';
  const conversion=`<section class="payment-conversion-panel" aria-label="Конверсия оплат">
    <div class="payment-conversion-main">
      <span class="payment-conversion-kicker"><i></i> КОНВЕРСИЯ ОПЛАТ</span>
      <div class="payment-conversion-rate">${cVal(paymentRate)}<small>%</small></div>
      <p>Доля заявок с положительной суммой в столбце F</p>
      <div class="payment-conversion-track" role="img" aria-label="Оплатили ${number(amountPaid.length)} из ${number(applications.length)} заявок">
        <i style="width:${paymentRate}%"></i><b style="left:${paymentRate}%"></b>
      </div>
    </div>
    <div class="payment-conversion-badges" aria-label="Сводка по самостоятельным установкам">
      <div class="payment-conversion-badge"><span>Самостоятельные заявки</span><strong>${number(selfRows.length)}</strong><small>Всего в выбранном периоде</small></div>
      <div class="payment-conversion-badge paid"><span>Оплачено по F</span><strong>${number(selfPaid)}</strong><small>Заявок с суммой больше нуля</small></div>
      <div class="payment-conversion-badge unpaid"><span>Не оплачено</span><strong>${number(selfUnpaid)}</strong><small>Заявок · F пусто или 0</small></div>
    </div>
    <div class="payment-conversion-actions">
      <button type="button" class="payment-conversion-choice paid" data-payment-amount="paid" ${amountPaid.length?'':'disabled'}>
        <span><i></i> Оплатили</span><strong>${cVal(amountPaid.length)}</strong><small>${share(amountPaid.length,applications.length)}% · сумма F указана</small>
      </button>
      <button type="button" class="payment-conversion-choice unpaid" data-payment-amount="unpaid" ${amountUnpaid.length?'':'disabled'}>
        <span><i></i> Не оплатили</span><strong>${cVal(amountUnpaid.length)}</strong><small>${share(amountUnpaid.length,applications.length)}% · сумма F пустая или 0</small>
      </button>
    </div>
  </section>`;
  return card('Результат клиентами',
    `<div class="priority-status-grid">${featured}</div>
     ${conversion}
     <details class="result-catalog"><summary>Каталог остальных результатов <span>${others.length} статусов</span></summary>
       <div class="priority-other-heading"><span>Другие статусы</span><span>Количество и доля</span></div>${otherHtml}
     </details>`,
    'Нажмите на карточку, чтобы открыть заявки. Конверсия оплаты считается по столбцу F: положительная сумма — оплачено; пустая или нулевая — не оплачено.');
}

function requestFlowCard(){
  const records=eventRows().filter(r=>r.source!=='noesp');
  const monthFocus=s.month||new Date().toISOString().slice(0,7);
  const monthArrivals=records.filter(r=>Piot.hasApplication(r)&&isoDay(r.date).slice(0,7)===monthFocus).length;
  const monthFocusLabel=s.month?monthLabel(s.month):'Текущий месяц';
  const gran=s.periodMode==='month'&&!s.month?'month':'day';
  const raw=periodActivity(records,gran);
  const byKey=new Map(raw.map(x=>[x.key,x]));
  let keys=[];
  if(s.periodMode==='month'&&s.month){
    const first=s.month+'-01';
    const next=shiftDay(first,32).slice(0,7)+'-01';
    const days=Math.round((new Date(next+'T12:00:00Z')-new Date(first+'T12:00:00Z'))/86400000);
    for(let i=0;i<days;i++)keys.push(shiftDay(first,i));
  }else if(s.periodMode==='week'){
    const start=periodWindow().start;
    for(let i=0;i<7;i++)keys.push(shiftDay(start,i));
  }else if(s.periodMode==='day'){
    keys=[periodWindow().start];
  }else{
    keys=[...new Set([...raw.map(x=>x.key),...records.map(r=>isoDay(r.date).slice(0,7)).filter(Piot.validMonth)])].sort();
  }
  const points=keys.map(key=>{
    const found=byKey.get(key)||{};
    return {key,total:Number(found.total)||0,done:Number(found.done)||0,closed:Number(found.closed)||0};
  });
  const total=points.reduce((n,x)=>n+x.total,0);
  const active=points.filter(x=>x.total>0);
  const avg=active.length?(total/active.length):0;
  const peak=points.reduce((best,x)=>x.total>best.total?x:best,{key:'',total:0});
  const theme=document.documentElement.dataset.theme||'light';
  const createdColor=theme==='ubuntu'?'#f05b9d':theme==='dark'?'#55d7b5':'#4a9df4';
  const doneColor=theme==='ubuntu'?'#ffc36d':theme==='dark'?'#7fb7ff':'#20b78b';
  const closedColor=theme==='ubuntu'?'#b78aff':theme==='dark'?'#c39bff':'#9871e8';
  const periodUnit=gran==='month'?'месяцам':'дням';
  const averageLabel=gran==='month'?'В среднем за месяц':'В среднем за активный день';
  const peakLabel=gran==='month'?'Пиковый месяц':'Пиковый день';
  const peakName=peak.key?shortLabel(peak.key):'—';
  const chartHtml=points.length?chart(points.map(x=>shortLabel(x.key)),[
    {name:'Создано',type:'bar',values:points.map(x=>x.total),color:createdColor},
    {name:'Выполнено',values:points.map(x=>x.done),color:doneColor,area:false},
    {name:'Закрыто',values:points.map(x=>x.closed),color:closedColor,area:false}
  ],{title:'Поступление и движение заявок по '+periodUnit}):empty('Нет заявок за выбранный период.');
  const details=points.length?`<details class="arrival-exact-values"><summary>Точные значения по ${periodUnit}</summary>
    <div class="arrival-exact-grid">${points.map(x=>`<div><span>${h(shortLabel(x.key))}</span><b>${number(x.total)}</b></div>`).join('')}</div>
  </details>`:'';
  const body=`<div class="arrival-insights">
      <div class="arrival-insight primary"><span>Новых заявок</span><strong>${cVal(total)}</strong><small>за ${s.periodMode==='month'?(s.month?'выбранный месяц':'всё время'):s.periodMode==='week'?'неделю':'день'}</small></div>
      <div class="arrival-insight accent-month"><span>Заявок за месяц</span><strong>${cVal(monthArrivals)}</strong><small>${h(monthFocusLabel)}</small></div>
      <div class="arrival-insight"><span>${averageLabel}</span><strong>${number(Math.round(avg*10)/10)}</strong><small>${active.length} активных ${gran==='month'?'месяцев':'дней'}</small></div>
      <div class="arrival-insight"><span>${peakLabel}</span><strong>${peakName}</strong><small>${number(peak.total)} ${peak.total===1?'заявка':'заявок'}</small></div>
    </div>
    <div class="arrival-flow-chart">${chartHtml}</div>${details}`;
  const sub=gran==='month'?'Новые заявки сгруппированы по месяцам.':'Новые заявки показаны по дням выбранного периода; выполненные и закрытые — по дате статуса.';
  return card('Поступление заявок',body,sub);
}

function home(){
  const a=periodSummary(eventRows());
  // Показатель по F для выбранной даты/недели/месяца.
  const unpaid=rows().filter(r=>r.source==='main'&&Piot.hasApplication(r)&&!(Number(r.amount)>0)).length;

function financePeriods(rr){
  const periods=new Map();
  const keyOf=r=>Piot.periodKey(r.date||'',s.gran);
  function item(key){
    if(!periods.has(key))periods.set(key,{key,total:0,paid:0,lp:0,espNoTask:0,espManual:0,sp:0,other:0,totalIncome:0});
    return periods.get(key);
  }
  rr.forEach(r=>{
    const row=item(keyOf(r)),value=Piot.rev(r,cfg());
    if(r.source!=='noesp')row.total++;
    if(r.source!=='noesp'&&value)row.paid++;
    if(!value)return;
    if(r.source==='noesp')row.espNoTask+=value;
    else{
      const bucket=Piot.bucket(r,cfg());
      if(bucket==='lp')row.lp+=value;
      else if(bucket==='sp')row.sp+=value;
      else row.other+=value;
    }
  });
  // Manual ESP is month-specific; do not distribute the monthly value across days or weeks.
  if(s.gran==='month'&&s.periodMode==='month'&&!detailed()){
    Object.entries(s.data.ledger||{}).forEach(([key,value])=>{
      if(!Piot.validMonth(key)||(s.month&&key!==s.month))return;
      const amount=Number(value&&value.esp)||0;
      if(amount) item(key).espManual+=amount;
    });
  }
  return Array.from(periods.values()).sort((a,b)=>{
    if(a.key==='Без даты')return 1;
    if(b.key==='Без даты')return -1;
    return a.key.localeCompare(b.key);
  }).map(row=>{row.totalIncome=row.lp+row.espNoTask+row.espManual;return row;});
}

const PROFIT_ITEMS_KEY='life_pay_expense_items_v1';
function profitReadLocal(){
  try{const x=JSON.parse(localStorage.getItem(PROFIT_ITEMS_KEY)||'{}');return x&&typeof x==='object'&&!Array.isArray(x)?x:{};}
  catch(e){return {};}
}
function profitWriteLocal(){
  const all=profitReadLocal();
  for(const [month,items] of Object.entries(s.profitLines)) if(Piot.validMonth(month)) all[month]=items;
  try{localStorage.setItem(PROFIT_ITEMS_KEY,JSON.stringify(all));}catch(e){}
}
function profitLinesFor(month){
  if(!month)return [];
  if(!Array.isArray(s.profitLines[month])){
    const stored=profitReadLocal()[month];
    s.profitLines[month]=Array.isArray(stored)&&stored.length
      ?stored.slice(0,40).map(x=>({name:String(x.name||'Прочие расходы').slice(0,100),amount:String(x.amount||'')}))
      :[{name:'Расходы',amount:String((cfg().monthlyExpenses||{})[month]||'')}];
  }
  return s.profitLines[month];
}
function profitMoney(value){
  const n=Piot.amount(value);
  return n!=null&&n>=0?n:null;
}
function profitTotalFromLines(items){
  let total=0;
  for(const item of items){
    if(!String(item.amount||'').trim())continue;
    const n=profitMoney(item.amount);
    if(n==null||n<0) return null;
    total+=n;
    if(total>1e12)return null;
  }
  return Math.round(total*100)/100;
}
function profitShowPreview(){
  if(s.page!=='profit'||!s.month||!s.data)return;
  const total=profitTotalFromLines(profitLinesFor(s.month));
  const income=Piot.income(s.data.records||[],s.data.ledger||{},s.month,cfg()).total;
  const display=total===null?'Проверьте суммы':rub(total);
  $$('[data-profit-preview-expenses]').forEach(n=>n.textContent=display);
  $$('[data-profit-preview-net]').forEach(n=>n.textContent=total===null?'—':rub(income-total));
  const error=$('[data-profit-validation]'); if(error)error.textContent=total===null?'Укажите неотрицательные суммы (до 1 трлн ₽).':'';
}
async function saveProfitCalculator(){
  if(!s.month)throw Error('Выберите месяц для сохранения.');
  const items=profitLinesFor(s.month).map(x=>({name:String(x.name||'').trim().slice(0,100)||'Расходы',amount:profitMoney(x.amount||'0')}));
  if(items.some(x=>x.amount===null))throw Error('Проверьте суммы расходов.');
  const total=profitTotalFromLines(items);
  if(total===null)throw Error('Общая сумма расходов слишком велика.');
  const month=s.month;
  const config=JSON.parse(JSON.stringify(s.configDraft||cfg()));
  config.monthlyExpenses=config.monthlyExpenses||{};
  config.monthlyExpenses[month]=total;
  const cleaned=Piot.validateConfig(config);
  // Сохраняем итог существующим серверным методом: это работает со старым Code.gs.
  const saved=await rpc('apiSaveConfig',{config:cleaned,revision:cfg().revision});
  s.data.config=saved; s.configDraft=null; s.configDirty=false;
  s.profitLines[month]=items.map(x=>({name:x.name,amount:String(x.amount)}));
  profitWriteLocal();
  const financial=Piot.income(s.data.records||[],s.data.ledger||{},month,cfg());
  let sheetSaved=false;
  try{
    // Опциональное дополнение Code.gs: запись детализации в «Чистая прибыль».
    const result=await rpc('apiSaveProfit',{month,items,income:financial.total,sp:financial.sp});
    sheetSaved=!!(result&&result.saved);
  }catch(e){ /* старый Code.gs ещё не поддерживает этот метод */ }
  s.profitSheetConnected=sheetSaved;
  render({fx:false});
  toast(sheetSaved?'Расходы и чистая прибыль записаны в Google Таблицу.':
      'Сумма расходов сохранена на сервере. Для детализации в листе «Чистая прибыль» установите дополнение Code.gs.',!sheetSaved);
}

function cleanProfit(){
  const ledger=s.data.ledger||{};
  const expenses=cfg().monthlyExpenses||{};
  const records=s.data.records||[];
  const monthSet=new Set((s.data.months||[]).concat(Object.keys(ledger),Object.keys(expenses)));
  records.forEach(r=>[r.date,r.dateStatus].forEach(d=>{
    const key=String(d||'').slice(0,7);
    if(Piot.validMonth(key))monthSet.add(key);
  }));
  const months=Array.from(monthSet).filter(Piot.validMonth).sort();
  const rows=months.map(key=>{
    const income=Piot.income(records,ledger,key,cfg());
    const expense=Number(expenses[key])||0;
    return {key,lp:income.lp,espNoTask:income.espNoTask,espManual:income.espManual,
      sp:income.sp,income:income.total,expense:expense,profit:income.total-expense};
  });
  const allIncome=Piot.income(records,ledger,'',cfg());
  const selected=s.month?(rows.find(x=>x.key===s.month)||{key:s.month,lp:0,espNoTask:0,espManual:Number((ledger[s.month]||{}).esp)||0,sp:0,income:0,expense:0,profit:0}):null;
  const income=s.month?selected.income:allIncome.total;
  const expense=s.month?selected.expense:rows.reduce((sum,x)=>sum+x.expense,0);
  const profit=income-expense;
  const expenseInput=profitCalculator(s.month,income);
  let html=`<section class="profit-hero">
    <div class="profit-heading"><span class="profit-kicker">ФИНАНСОВЫЙ РЕЗУЛЬТАТ</span><h2>Чистая прибыль</h2>
      <p>Доход Life Pay и ЕСП без СП минус расходы. Доход СП показывается отдельно и в расчёт не входит.</p></div>
    <div class="profit-total">
      <span>${s.month?monthLabel(s.month):'За всё время'}</span>
      <strong${s.month?' data-profit-preview-net':''}>${rub(profit)}</strong>
      <small>${profit<0?'Расходы превышают доходы':profit===0?'Доходы равны расходам':'Доходы за вычетом расходов'}</small>
    </div>
    <div class="profit-kpis">
      <div><span>ДОХОД БЕЗ СП</span><strong>${cVal(income,true)}</strong><small>Life Pay + ЕСП</small></div>
      <div><span>РАСХОДЫ</span><strong${s.month?' data-profit-preview-expenses':''}>${cVal(expense,true)}</strong><small>Введены вручную по месяцам</small></div>
      <div><span>СП ОТДЕЛЬНО</span><strong>${cVal(s.month?selected.sp:allIncome.sp,true)}</strong><small>Не включается в прибыль</small></div>
    </div>
  </section>`;
  html+=s.periodMode!=='month'?`<p class="period-month-note period-note-block">Расходы и чистая прибыль ведутся по месяцам. Дневной/недельный доход можно посмотреть в «Финансах»; расходы без даты нельзя корректно распределить на отдельные дни.</p>`:'';
  html+=expenseInput;
  if(!s.month&&rows.length){
    const ordered=rows.slice().reverse();
    html+=card('Динамика доходов и расходов',chart(ordered.map(x=>shortLabel(x.key)),[
      {name:'Доход без СП',values:ordered.map(x=>x.income),color:'#25c997'},
      {name:'Расходы',values:ordered.map(x=>x.expense),color:'#f0a34b'}
    ],{money:true,title:'Доходы и расходы по месяцам'}),'Суммы показаны по месяцам. СП в доход без СП не включается.');
  }
  const visibleRows=s.month?rows.filter(x=>x.key===s.month):rows.slice().reverse();
  const body=visibleRows.length?`<div class="table-wrap"><table class="profit-table">
    <thead><tr><th>Месяц</th><th>Life Pay</th><th>ЕСП без задачи</th><th>Доход ЕСП</th><th>Доход без СП</th><th>Расходы</th><th>Чистая прибыль</th></tr></thead>
    <tbody>${visibleRows.map(x=>`<tr>
      <td><button type="button" class="text-btn" data-select-month="${x.key}">${monthLabel(x.key)}</button></td>
      <td class="number">${rub(x.lp)}</td><td class="number">${rub(x.espNoTask)}</td>
      <td class="number">${rub(x.espManual)}</td><td class="number">${rub(x.income)}</td>
      <td class="number">${rub(x.expense)}</td><td class="number profit-positive">${rub(x.profit)}</td>
    </tr>`).join('')}</tbody></table></div>`:empty('Нет данных за выбранный период.');
  html+=card('Расчёт по месяцам',body,'Помесячная детализация. Нажмите на месяц, чтобы открыть его и изменить расходы.');
  return periodPicker()+html;
}

function planMatchesResult(value,target){
  const v=Piot.norm(value||''), t=Piot.norm(target||'');
  return v===t||v.startsWith(t+':')||v.startsWith(t+' ');
}
function planRecords(){
  return rows().filter(r=>r.source==='main'&&(String(r.status||'').trim()||String(r.taskStatus||'').trim())
    &&(!s.planStatus||r.status===s.planStatus)
    &&(!s.planResult||(s.planResult==='paid-lp'?Piot.isPaidInstallation(r,'lp',cfg()):
      s.planResult==='paid-avtbiz'?Piot.isPaidInstallation(r,'avtbiz',cfg()):
      planMatchesResult(r.taskStatus,s.planResult))));
}

function planPage(){
  const ledger=s.data.ledger, m=ledger[s.month]||Piot.emptyMonth();
  // One canonical event stream for plan statistics on Home and Plan pages.
  // IMPORTANT: do not pre-filter by the application creation month: completed
  // tasks are attributed to the month of dateStatus by Piot.eventSummary.
  const commonRecords=eventRows();
  const stats=Piot.eventSummary(commonRecords,cfg(),s.month);

  const done=stats.done;
  // Plan-page-only dropdowns are used for the result categories below, not
  // for changing the monthly headline (which must match Home).
  const resultRecords=planRecords();
  const paidResultRecords=rows().filter(r=>r.source==='main'&&(!s.planStatus||r.status===s.planStatus));

  html+=`<div class="hero-grid">${heroPlan(commonRecords)}${heroOpen(commonRecords)}</div>`;
  if(!s.month) html+='<div class="inactive-warning">Выбран период «За всё время». История планов доступна ниже. Чтобы изменить план, выберите конкретный месяц.</div>';
  html+=`<div class="kpis">
    ${kpi('План на месяц',s.month&&m.plan!=null?cVal(m.plan):'—')}
    ${kpi('Выполнено',s.month?cVal(done):'—')}
    ${kpi('Осталось',s.month&&m.plan!=null?cVal(Math.max(0,m.plan-done)):'—')}
    ${kpi('Выполнение',m.plan!=null&&m.plan>0?pct(done,m.plan)+'%':'—')}
  </div>`;
  const resultItems=[
    {name:'Клиент сам установил',index:'01'},
    {name:'Клиент настроен с нашей помощью',index:'02'},
    {name:'Платные установки Life Pay',index:'03',installation:'lp',tone:'paid-lp'},
    {name:'Платные установки Авт.Биз',index:'04',installation:'avtbiz',tone:'paid-autobiz'}
  ];
  html+=card('Результат клиентами',`<div class="plan-result-grid">
    ${resultItems.map(item=>{
      const n=item.installation
        ?paidResultRecords.filter(r=>Piot.isPaidInstallation(r,item.installation,cfg())).length
        :resultRecords.filter(r=>planMatchesResult(r.taskStatus,item.name)).length;
      const action=item.installation?`data-paid-installation="${item.installation}"`:`data-plan-pick="${h(item.name)}"`;
      return `<button class="plan-result ${item.tone||''}" ${action} type="button"><span>${item.index} · ${h(item.name)}</span><strong>${cVal(n)}</strong><span>${item.installation?'Открыть заявки →':'Открыть категорию →'}</span></button>`;
    }).join('')}</div>`,'Результаты по выбранному периоду. Откройте категорию или заявки с платными установками.');
  const tbl=`<div class="table-wrap"><table>
    <thead><tr><th>Месяц</th><th>План</th><th>Выполнено</th><th>Закрыто</th><th>Выполнение</th></tr></thead>
    <tbody>${keys.map(k=>{
      const row=ledger[k]||{}, a=mm[k]||{done:0,closed:0};
      const pp=row.plan?pct(a.done,row.plan):0;
      return `<tr><td><button class="text-btn" data-select-month="${k}">${monthLabel(k)}</button></td>
        <td>${number(row.plan)}</td><td>${number(a.done)}</td><td>${number(a.closed)}</td>
        <td style="min-width:120px"><div class="progress" style="--color:#00a56a"><i style="width:${Math.min(100,pp)}%"></i></div></td></tr>`;
    }).join('')}${keys.length?'':'<tr><td colspan="5" class="plan-no-months">Планы пока не внесены. Сохраните план в «Настройках» — месяц появится здесь.</td></tr>'}</tbody></table></div>`;
  html+=card('История по месяцам',tbl,'','<button class="btn small" data-page="settings">'+icon('edit')+' Изменить</button>');
  if(cfg().showCharts&&keys.length){
    const recent=keys.slice().sort().slice(-12);
    html+=card('План и выполнение',chart(recent.map(shortLabel),[
      {name:'План',type:'bar',values:recent.map(k=>ledger[k]?(ledger[k].plan||0):0),color:'#a3b1c1'},
      {name:'Выполнено',type:'bar',values:recent.map(k=>mm[k]?mm[k].done:0),color:'#29c58e'}
    ],{title:'План и выполнение'}),'');
  }
  return html;
}

function tableRows2(){
  const sourceRows = rows().filter(r=>s.filter.source==='noesp' ? r.source==='noesp' : Piot.hasApplication(r))
    .filter(r=>!s.bankRecognizedOnly||Boolean(Piot.bank(r,cfg())));
  return sourceRows.filter(r=>!s.installation||Piot.isPaidInstallation(r,s.installation,cfg())).filter(r=>
    s.paid==='amount'?Number(r.amount)>0:
    s.paid==='paid'?Piot.rev(r,cfg())>0:
    s.paid==='invoice'?Piot.isInvoice(r,cfg()):
    s.paid==='zero'?!(Number(r.amount)>0):true
  ).slice().sort((a,b)=>{
    const av=a[s.sort],bv=b[s.sort];
    return(typeof av==='number'?av-bv:String(av||'').localeCompare(String(bv||''),'ru',{numeric:true}))*s.direction;
  });
}

    const logRows=logs.length?logs.map(item=>`<tr><td>${h(item.at?new Date(item.at).toLocaleString('ru-RU'):'—')}</td><td>${h(item.event||'Вход')}</td><td>${h(item.device||'Это устройство')}</td></tr>`).join(''):'<tr><td colspan="3" style="text-align:center;padding:20px;color:var(--muted)">Входов пока нет на этом устройстве.</td></tr>';
    html+=`<div class="security-grid">
      <section class="glass card"><header class="cardhead"><div><h2>Пароль входа</h2><p class="muted">Смените начальный пароль на длинный уникальный.</p></div></header>
        <div class="security-stat-row">
          <div class="security-stat"><span>Автоблокировка</span><b>${info.idleMinutes} мин</b></div>
          <div class="security-stat"><span>Записей журнала</span><b>${info.logCount}</b></div>
          <div class="security-stat"><span>Хранение</span><b>На устройстве</b></div>
        </div>
        ${info.defaultPassword?'<p class="security-note" style="margin-bottom:13px">Используется начальный пароль. После первого входа обязательно задайте свой пароль длиной не менее 10 символов.</p>':''}
        <form class="security-form" id="changePasswordForm" autocomplete="off">
          <div class="field"><label for="currentAccessPassword">Текущий пароль</label><input id="currentAccessPassword" type="password" autocomplete="current-password" placeholder="Введите текущий пароль"></div>
          <div class="field"><label for="newAccessPassword">Новый пароль</label><input id="newAccessPassword" type="password" autocomplete="new-password" minlength="10" placeholder="Не менее 10 символов"></div>
          <div class="field"><label for="confirmAccessPassword">Повторите новый пароль</label><input id="confirmAccessPassword" type="password" autocomplete="new-password" minlength="10" placeholder="Повторите новый пароль"></div>
          <button type="button" class="btn primary" data-save-password>Сохранить новый пароль</button>
        </form>
        <p class="note">Пароль хранится в виде криптографического хеша в локальном хранилище браузера, а не в открытом виде.</p>
      </section>
      <section class="glass card"><header class="cardhead"><div><h2>Журнал входов</h2><p class="muted">Последние входы с этого браузера</p></div><button type="button" class="btn small" data-clear-access-log>Очистить</button></header>
        <div class="table-wrap"><table class="access-log"><thead><tr><th>Дата и время</th><th>Событие</th><th>Устройство</th></tr></thead><tbody>${logRows}</tbody></table></div>
        <p class="security-note" style="margin-top:13px">Это локальный журнал: он показывает входы только в этом браузере. Чтобы видеть всех сотрудников и входы с других устройств, нужны персональные учётные записи и серверный журнал в Google Apps Script. Геолокация не собирается.</p>
      </section>
    </div>`;
  }else{
    const rules=[['done','Выполненные статусы'],['closed','Закрытые'],['invoice','Счета'],['lp','Статусы LP'],['sp','Статусы СП']];
    html+=`<div class="settings-grid">
      ${card('Статусы',rules.map(([k,v])=>`<div class="field"><label>${v}</label><textarea data-rule="${k}">${h(c[k].join('\n'))}</textarea></div>`).join(''),'Одно правило — одна строка')}
      ${card('Банки',Piot.BANKS.map((b,i)=>`<div class="field"><label>${b.name}</label><textarea data-bankrule="${i}">${h(c.bankKeys[i].join('\n'))}</textarea></div>`).join('')+'<p class="note">Поля «Заказчик» и «Юр.лицо».</p>')}
    </div>${configButtons()}`;
  }
  return html;
}

function render(opt){
  opt=opt||{};
  if(!s.data) return;
  s.fx=opt.fx!==false;
  Object.keys(CHARTS).forEach(k=>delete CHARTS[k]);
  nav();
  $('#title').textContent=TITLES[s.page]||'Главная';
  document.body.classList.toggle('motion',fxOn());
  const pageMap={home,banks,finance,profit:cleanProfit,trend,plan:planPage,table:tablePage2,settings};
  $('#page').innerHTML=(pageMap[s.page]||home)();
  if(window.PIOT_THEME) window.PIOT_THEME.sync();
  $('#page').setAttribute('aria-busy','false');
  $('#page').className='page-enter'+(s.fx&&fxOn()?' anim':'');
  saveStatus();
  $('#updated').textContent=s.data.updated&& !Number.isNaN(new Date(s.data.updated).getTime()) ? 'Обновлено '+new Date(s.data.updated).toLocaleString('ru-RU') : 'Данные обновлены';
  if(s.fx) playCounters();
}

/* ---- tooltip ---- */
const tip=$('#chartTip');
function hideTip(){ tip.classList.remove('show'); $$('.chart-svg.live').forEach(el=>el.classList.remove('live')); }
document.addEventListener('pointermove',e=>{
  const hit=e.target.closest&&e.target.closest('[data-hit]');
  if(!hit){ hideTip(); return; }
  const uid=hit.dataset.hit, i=+hit.dataset.i, m=CHARTS[uid];
  if(!m) return;
  const svg=document.getElementById(uid);
  if(svg){
    svg.classList.add('live');
    const cross=document.getElementById(uid+'-cross');
    if(cross){ cross.setAttribute('x1',m.xs[i]); cross.setAttribute('x2',m.xs[i]); }
  }
  tip.innerHTML=`<div class="tip-h">${h(m.labels[i])}</div>`+m.series.map(sr=>
    `<div class="tip-r"><i style="background:${sr.color}"></i><span>${h(sr.name)}</span><b>${sr.money?rub(sr.values[i]||0):number(sr.values[i]||0)}</b></div>`).join('');
  tip.classList.add('show');
  const r=tip.getBoundingClientRect();
  let x=e.clientX+16, y=e.clientY-r.height/2;
  if(x+r.width>innerWidth-10) x=e.clientX-r.width-16;
  y=Math.max(10,Math.min(innerHeight-r.height-10,y));
  tip.style.left=x+'px'; tip.style.top=y+'px';
},{passive:true});
document.addEventListener('scroll',hideTip,{passive:true});

/* ---- загрузка ---- */
async function load(force){
  force=force||false;
  if(s.configDirty&&!confirm('Обновление сбросит несохранённые настройки. Продолжить?')) return;
  if(!force&&s.loaded) await flush();
  $('#reload').disabled=true;
  $('#topSave').textContent='Загрузка...';
  $('#topSave').className='pill warn';
  try{
    const d=await rpc('apiGetData');
    if(!d||!Array.isArray(d.records)||!d.ledger||!d.config||!Array.isArray(d.months))
      throw Error('Сервер вернул неполные данные. Проверьте функцию apiGetData() в Code.gs');
    if(!s.loaded){
      const available=d.months.filter(Piot.validMonth).slice().sort();
      s.month=Piot.validMonth(d.currentMonth)&&available.includes(d.currentMonth) ? d.currentMonth : (available[available.length-1]||'');
    }
    s.data=d; s.configDraft=null; s.configDirty=false; s.loaded=true;
    if(force){ s.draft={}; s.invalid={}; s.saveError=''; }
    options(); render();
  }catch(e){
    toast(e.message, true);
    if(!s.loaded)
      $('#page').innerHTML=`<section class="glass card">
        <h2>⚠️ Не удалось загрузить данные</h2>
        <p class="note" style="margin-top:12px;white-space:pre-line">${h(e.message)}</p>
        <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn primary" data-retry>↻ Повторить</button>
          <button class="btn" onclick="navigator.clipboard&&navigator.clipboard.writeText('${GAS_URL}').then(()=>alert('URL скопирован'))">Скопировать URL GAS</button>
        </div>
        <details style="margin-top:16px"><summary class="note" style="cursor:pointer">🔧 Как исправить</summary>
          <ol class="note" style="padding-left:18px;margin-top:8px;line-height:1.9">
            <li>Откройте Google Apps Script</li>
            <li>Убедитесь, что функция <code>doGet(e)</code> существует и возвращает JSON</li>
            <li>Опубликуйте: <b>Развернуть → Управление развёртываниями → Доступ: Все</b></li>
            <li>Скопируйте новую ссылку /exec и вставьте в переменную <code>GAS_URL</code></li>
          </ol>
        </details>
      </section>`;
  }finally{
    $('#reload').disabled=false;
  }
}

async function fetchProfitSheet(){
  if(s.profitSheetLoaded)return;
  s.profitSheetLoaded=true;
  try{
    const result=await rpc('apiGetProfit');
    if(result&&Array.isArray(result.entries)){
      for(const item of result.entries){
        if(Piot.validMonth(item.month)&&Array.isArray(item.items)&&!s.profitLines[item.month]){
          s.profitLines[item.month]=item.items.slice(0,40).map(x=>({name:String(x.name||'Расходы'),amount:String(x.amount||0)}));
        }
      }
      s.profitSheetConnected=true;
    }
  }catch(e){/* Сервер ещё не обновлён; работаем с существующими расходами */}
}
async function navigate(page){ await flush(); if(page==='profit')await fetchProfitSheet(); s.page=page; s.tablePage=1; render(); window.scrollTo({top:0,behavior:fxOn()?'smooth':'auto'}); }
async function changeMonth(month){
  if(month&&!Piot.validMonth(month)) return;
  try{ await flush(); s.month=month; if(s.periodMode!=='month'){if(!month)s.periodMode='month';else s.periodDate=defaultPeriodDay(month);} s.tablePage=1; options(); render(); }
  catch(e){ $('#month').value=s.month; toast('Сначала сохраните или исправьте текущий ввод.',true); }
}

async function saveConfig(){
  try{
    const clean=Piot.validateConfig(s.configDraft||cfg());
    const saved=await rpc('apiSaveConfig',{config:clean,revision:cfg().revision});
    s.data.config=saved; s.configDraft=null; s.configDirty=false;
    await load(); toast('Настройки сохранены');
  }catch(e){ toast(e.message,true); }
}

function configInput(el){
  if(!s.configDraft) s.configDraft=JSON.parse(JSON.stringify(cfg()));
  const c=s.configDraft;
  if(el.dataset.config){ const k=el.dataset.config; c[k]=el.type==='checkbox'?el.checked:Number(el.value); }
  if(el.dataset.rule) c[el.dataset.rule]=el.value.split('\n').map(x=>x.trim()).filter(Boolean);
  if(el.dataset.bankrule!=null) c.bankKeys[+el.dataset.bankrule]=el.value.split('\n').map(x=>x.trim()).filter(Boolean);
  if(el.dataset.expenseMonth){
    if(!c.monthlyExpenses||typeof c.monthlyExpenses!=='object')c.monthlyExpenses={};
    const value=el.value.trim();
    if(value==='')delete c.monthlyExpenses[el.dataset.expenseMonth];
    else {const amount=Number(value);if(Number.isFinite(amount)&&amount>=0&&amount<=1e12)c.monthlyExpenses[el.dataset.expenseMonth]=Math.round(amount*100)/100;}
  }
  s.configDirty=true;
  // Уведомляем о несохранённых настройках сразу, без перерисовки ввода:
  // иначе пользователь видит «Сохранено», хотя параметр уже изменён.
  $$('#page .savebar .note').forEach(node=>{
    if(s.page==='settings' && s.tab!=='money')node.textContent='Есть несохранённые настройки';
  });
  saveStatus();
}

/* ---- безопасность: смена локального пароля ---- */
async function changeAccessPassword(){
  const current=$('#currentAccessPassword')?.value||'';
  const next=$('#newAccessPassword')?.value||'';
  const confirmValue=$('#confirmAccessPassword')?.value||'';
  if(next!==confirmValue){toast('Новый пароль и подтверждение не совпадают.',true);return;}
  try{
    await window.PIOT_SECURITY.changePassword(current,next);
    toast('Пароль обновлён. Используйте его при следующем входе.');
    render({fx:false});
  }catch(err){toast(err.message||'Не удалось изменить пароль.',true);}
}

/* ---- события ---- */
async function handleClick(e){
  const el=e.target.closest('button, .bank-card'); if(!el) return;
  try{
    if(el.dataset.legend){
      const g=document.querySelectorAll('#'+el.dataset.legend+' [data-s="'+el.dataset.s+'"]');
      const off=el.classList.toggle('off');
      g.forEach(n=>n.classList.toggle('ser-off',off)); return;
    }
    if(el.id==='lockApp'){ window.PIOT_SECURITY&&window.PIOT_SECURITY.lock(); return; }
    if(el.hasAttribute('data-save-password')){ await changeAccessPassword(); return; }
    if(el.hasAttribute('data-clear-access-log')){
      if(confirm('Очистить локальный журнал входов на этом устройстве?')){ window.PIOT_SECURITY&&window.PIOT_SECURITY.clearLog(); render({fx:false}); toast('Локальный журнал очищен.'); }
      return;
    }
    if(el.dataset.page) await navigate(el.dataset.page);
    else if(el.hasAttribute('data-open-table')){s.installation='';s.bankRecognizedOnly=false;await navigate('table');}
    else if(el.hasAttribute('data-paid-installation')){
      s.installation=el.dataset.paidInstallation;
      s.bankRecognizedOnly=false;
      s.paid='';
      s.tablePage=1;
      await navigate('table');
    }
    else if(el.dataset.paymentAmount){
      s.installation='';
      s.bankRecognizedOnly=false;
      s.paid=el.dataset.paymentAmount==='paid'?'amount':'zero';
      s.tablePage=1;
      await navigate('table');
    }
    else if(el.hasAttribute('data-noesp-table')){
      Object.keys(s.filter).forEach(k=>s.filter[k]='');
      s.filter.source='noesp';
      await navigate('table');
    }
    else if(el.hasAttribute('data-plan-reset')){s.planStatus='';s.planResult='';render({fx:false});}
    else if(el.hasAttribute('data-plan-pick')){s.planResult=el.dataset.planPick;render({fx:false});}
    else if(el.hasAttribute('data-save')){ await flush(); toast('Месяц сохранён'); }
    else if(el.hasAttribute('data-clear-filters')){ await flush(); Object.keys(s.filter).forEach(k=>s.filter[k]=''); s.installation='';s.paid='';s.bankRecognizedOnly=false;s.tablePage=1; render(); }
    else if(el.dataset.periodMode){
      const mode=el.dataset.periodMode;
      if(!['month','week','day'].includes(mode))return;
      await flush();
      if(mode!=='month'&&!s.periodDate){s.periodDate=defaultPeriodDay(s.month);}
      if(mode!=='month'&&!s.month){s.month=s.periodDate.slice(0,7);options();}
      s.periodMode=mode;s.gran=mode;s.tablePage=1;render({fx:false});
    }
    else if(el.dataset.periodStep){
      await flush();
      const next=shiftDay(s.periodDate||defaultPeriodDay(s.month),Number(el.dataset.periodStep)*(s.periodMode==='week'?7:1));
      if(!next)return;
      s.periodDate=next;s.month=next.slice(0,7);s.tablePage=1;options();render({fx:false});
    }
    else if(el.dataset.gran){ s.gran=el.dataset.gran; render({fx:false}); }
    else if(el.hasAttribute('data-bank-unpaid-all')){
      s.installation='';s.paid='zero';s.bankRecognizedOnly=true;s.tablePage=1;await navigate('table');
    }
    else if(el.hasAttribute('data-bank-unpaid')){
      s.installation='';s.paid='zero';s.bankRecognizedOnly=false;s.filter.bank=el.dataset.bankUnpaid;s.tablePage=1;await navigate('table');
    }
    else if(el.dataset.bank){ s.installation='';s.paid='';s.bankRecognizedOnly=false;s.filter.bank=el.dataset.bank;s.tablePage=1;await navigate('table'); }
    else if(el.hasAttribute('data-task-status')){ s.installation='';s.paid='';s.bankRecognizedOnly=false;s.filter.task=el.dataset.taskStatus; s.tablePage=1; await navigate('table'); }
    else if(el.dataset.tab){ await flush(); s.tab=el.dataset.tab; render(); }
    else if(el.dataset.sort){ if(s.sort===el.dataset.sort)s.direction*=-1; else{s.sort=el.dataset.sort;s.direction=1;} s.tablePage=1; render({fx:false}); }
    else if(el.dataset.pag){ s.tablePage+=Number(el.dataset.pag); render({fx:false}); }
    else if(el.hasAttribute('data-export')){
      const out=tableRows2().map(r=>Object.assign({},r,{source:r.source==='noesp'?'Без задачи ЕСП':'Заявка'}));
      const url=URL.createObjectURL(new Blob([Piot.csv(out,COLS)],{type:'text/csv;charset=utf-8'}));
      const a=document.createElement('a'); a.href=url; a.download='piot-'+(s.month||'all')+'.csv'; a.click();
      setTimeout(()=>URL.revokeObjectURL(url),1500); toast('Экспортировано: '+out.length+' строк');
    }
    else if(el.dataset.selectMonth) await changeMonth(el.dataset.selectMonth);
    else if(el.hasAttribute('data-profit-add')){if(s.month&&profitLinesFor(s.month).length<40){profitLinesFor(s.month).push({name:'',amount:''});render({fx:false});}}
    else if(el.hasAttribute('data-profit-remove')){if(s.month){profitLinesFor(s.month).splice(Number(el.dataset.profitRemove),1);if(!profitLinesFor(s.month).length)profitLinesFor(s.month).push({name:'Расходы',amount:''});render({fx:false});}}
    else if(el.hasAttribute('data-save-profit')) await saveProfitCalculator();
    else if(el.hasAttribute('data-save-config')) await saveConfig();
    else if(el.hasAttribute('data-reset-config')){
      if(confirm('Вернуть стандартные настройки?')){ s.configDraft=Piot.defaults(); s.configDirty=true; render(); }
    }
    else if(el.hasAttribute('data-close-dialog')) $('#conflict').close();
    else if(el.id==='resolveConflict'){ $('#conflict').close(); clearTimeout(s.timer); await load(true); }
    else if(el.id==='reload'||el.hasAttribute('data-retry')) await load();
    else if(el.id==='fullscreen'){
      if(!document.fullscreenElement){
        if(!document.documentElement.requestFullscreen) throw Error('Полный экран недоступен');
        await document.documentElement.requestFullscreen();
      }else await document.exitFullscreen();
    }
    else if(el.id==='prevMonth'||el.id==='nextMonth'){
      const list=s.data.months.filter(Piot.validMonth).slice().sort(), idx=list.indexOf(s.month);
      if(idx<0) await changeMonth(s.data.currentMonth);
      else{ const n=idx+(el.id==='prevMonth'?-1:1); if(n>=0&&n<list.length) await changeMonth(list[n]); }
    }
  }catch(err){ toast(err.message,true); }
}
document.addEventListener('click', handleClick);
document.addEventListener('error',e=>{if(e.target&&e.target.matches&&e.target.matches('.bank-chip-logo')) e.target.hidden=true;},true);

let searchTimer;
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.field){ edit(el.dataset.field,el.value); el.setAttribute('aria-invalid',s.invalid[el.dataset.field]?'true':'false'); }
  else if(el.dataset.filter==='q'){
    clearTimeout(searchTimer); s.filter.q=el.value;
    searchTimer=setTimeout(()=>{
      const p=el.selectionStart; render({fx:false});
      const inp=$('[data-filter=q]');
      if(inp){ inp.focus(); try{inp.setSelectionRange(p,p);}catch(err){} }
    },280);
  }
  else if(el.dataset.profitName!==undefined && s.month){profitLinesFor(s.month)[+el.dataset.profitName].name=el.value;}
  else if(el.dataset.profitAmount!==undefined && s.month){profitLinesFor(s.month)[+el.dataset.profitAmount].amount=el.value;profitShowPreview();}
  else if(el.dataset.config||el.dataset.rule||el.dataset.bankrule!=null||el.dataset.expenseMonth) configInput(el);
});
document.addEventListener('change',async e=>{
  const el=e.target;
  if(el.id==='month') await changeMonth(el.value);
  else if(el.id==='periodDate'){const date=isoDay(el.value);if(date){await flush();s.periodDate=date;s.month=date.slice(0,7);s.tablePage=1;options();render({fx:false});}}
  else if(el.dataset.planStatus!==undefined){ s.planStatus=el.value; render({fx:false}); }
  else if(el.dataset.planResult!==undefined){ s.planResult=el.value; render({fx:false}); }
  else if(el.dataset.filter){ s.filter[el.dataset.filter]=el.value; s.tablePage=1; render({fx:false}); }
  else if(el.id==='paidFilter'){ s.paid=el.value; s.tablePage=1; render({fx:false}); }
  else if(el.id==='installationFilter'){ s.installation=el.value; s.paid=''; s.tablePage=1; render({fx:false}); }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.field){ e.preventDefault(); flush().catch(()=>{}); }
});
window.addEventListener('beforeunload',e=>{
  if(s.saving||Object.keys(s.draft).length||s.configDirty){ e.preventDefault(); e.returnValue=''; }
});

nav(); load();
})();
};

// Если пин уже введён — стартуем сразу
if(sessionStorage.getItem('piot_pin_ok')==='1' && document.getElementById('app').style.display!=='none'){
  if(window.PIOT_SECURITY) window.PIOT_SECURITY.startApp();
  else window.PIOT_START();
}
</script>
